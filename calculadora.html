<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Calculadora</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #f0f0f0;
      font-family: Arial;
    }

    .calculadora {
      background: #222;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.3);
    }

    #display {
      width: 100%;
      height: 50px;
      font-size: 20px;
      margin-bottom: 10px;
      text-align: right;
      padding: 5px;
      border: none;
      border-radius: 5px;
    }

    .botoes {
      display: grid;
      grid-template-columns: repeat(4, 60px);
      gap: 10px;
    }

    button {
      height: 60px;
      font-size: 18px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .operador {
      background: orange;
      color: white;
    }

    .igual {
      background: green;
      color: white;
      grid-column: span 2;
    }

    .limpar {
      background: red;
      color: white;
      grid-column: span 2;
    }
  </style>
</head>
<body>

<div class="calculadora">
  <input type="text" id="display" disabled>

  <div class="botoes">
    <button onclick="limpar()" class="limpar">C</button>
    <button onclick="apagar()">⌫</button>
    <button onclick="adicionar('/')">/</button>

    <button onclick="adicionar('7')">7</button>
    <button onclick="adicionar('8')">8</button>
    <button onclick="adicionar('9')">9</button>
    <button onclick="adicionar('*')" class="operador">*</button>

    <button onclick="adicionar('4')">4</button>
    <button onclick="adicionar('5')">5</button>
    <button onclick="adicionar('6')">6</button>
    <button onclick="adicionar('-')" class="operador">-</button>

    <button onclick="adicionar('1')">1</button>
    <button onclick="adicionar('2')">2</button>
    <button onclick="adicionar('3')">3</button>
    <button onclick="adicionar('+')" class="operador">+</button>

    <button onclick="adicionar('0')">0</button>
    <button onclick="adicionar('.')">.</button>
    <button onclick="calcular()" class="igual">=</button>
  </div>
</div>

<script>
  function adicionar(valor) {
    document.getElementById("display").value += valor;
  }

  function limpar() {
    document.getElementById("display").value = "";
  }

  function apagar() {
    let display = document.getElementById("display");
    display.value = display.value.slice(0, -1);
  }

  function calcular() {
    let display = document.getElementById("display");
    try {
      display.value = eval(display.value);
    } catch {
      display.value = "Erro";
    }
  }
</script>

</body>
</html>
