<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #f4f4f4;
    }

    .calculadora {
      background: #1f1f1f;
      padding: 20px;
      border-radius: 15px;
      width: 320px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.25);
    }

    #display {
      width: 100%;
      height: 70px;
      border: none;
      outline: none;
      border-radius: 10px;
      margin-bottom: 15px;
      padding: 10px;
      font-size: 28px;
      text-align: right;
      background: #2d2d2d;
      color: white;
    }

    .botoes {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    button {
      border: none;
      height: 65px;
      border-radius: 10px;
      font-size: 22px;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      transform: scale(1.05);
    }

    .numero {
      background: #3a3a3a;
      color: white;
    }

    .operador {
      background: #ff9500;
      color: white;
    }

    .limpar {
      background: #ff3b30;
      color: white;
    }

    .igual {
      background: #34c759;
      color: white;
    }
  </style>
</head>

<body>

  <div class="calculadora">
    <input type="text" id="display" readonly>

    <div class="botoes">
      <button class="limpar" onclick="limpar()">C</button>
      <button class="limpar" onclick="apagar()">⌫</button>
      <button class="operador" onclick="adicionar('%')">%</button>
      <button class="operador" onclick="adicionar('/')">÷</button>

      <button class="numero" onclick="adicionar('7')">7</button>
      <button class="numero" onclick="adicionar('8')">8</button>
      <button class="numero" onclick="adicionar('9')">9</button>
      <button class="operador" onclick="adicionar('*')">×</button>

      <button class="numero" onclick="adicionar('4')">4</button>
      <button class="numero" onclick="adicionar('5')">5</button>
      <button class="numero" onclick="adicionar('6')">6</button>
      <button class="operador" onclick="adicionar('-')">−</button>

      <button class="numero" onclick="adicionar('1')">1</button>
      <button class="numero" onclick="adicionar('2')">2</button>
      <button class="numero" onclick="adicionar('3')">3</button>
      <button class="operador" onclick="adicionar('+')">+</button>

      <button class="numero" onclick="adicionar('0')">0</button>
      <button class="numero" onclick="adicionar('.')">.</button>
      <button class="igual" style="grid-column: span 2;" onclick="calcular()">=</button>
    </div>
  </div>

  <script>
    const display = document.getElementById("display");

    function adicionar(valor) {
      display.value += valor;
    }

    function limpar() {
      display.value = "";
    }

    function apagar() {
      display.value = display.value.slice(0, -1);
    }

    function calcular() {
      try {
        if(display.value === "") return;
        display.value = eval(display.value);
      } catch {
        display.value = "Erro";
      }
    }

    // Suporte ao teclado
    document.addEventListener("keydown", (e) => {
      const tecla = e.key;

      if (!isNaN(tecla) || ['+', '-', '*', '/', '.', '%'].includes(tecla)) {
        adicionar(tecla);
      }

      if (tecla === "Enter") {
        calcular();
      }

      if (tecla === "Backspace") {
        apagar();
      }

      if (tecla === "Escape") {
        limpar();
      }
    });
  </script>

</body>
</html>
